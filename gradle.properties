# Память и кодировка для Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Используем библиотеки AndroidX (обязательно для современных проектов)
android.useAndroidX=true
# Класс R содержит только ресурсы своего модуля (быстрее сборка)
android.nonTransitiveRClass=true
# Официальный стиль оформления Kotlin-кода
kotlin.code.style=official
